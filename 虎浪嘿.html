<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虎浪嘿 🐯 | 崔瀚率說窩不執導</title>
  <meta name="description" content="虎浪嘿！我要衝2028克拉島！崔瀚率說窩不執導～小十七 SEVENTEEN 與 Hoshi 權順榮的專屬元氣基地！">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    .horanghae-hero {
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }
    .horanghae-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(255, 122, 0, 0.2), rgba(255, 64, 129, 0.2));
      border: 1px solid rgba(255, 122, 0, 0.4);
      color: #D65A00;
      font-weight: 800;
      font-size: 1rem;
      padding: 8px 22px;
      border-radius: var(--radius-full);
      margin-bottom: 18px;
    }
    [data-theme="dark"] .horanghae-badge {
      color: #FFAA47;
    }
    .horanghae-title {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #FF7A00 0%, #FF4081 50%, #9D72E8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .horanghae-subtitle {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
    }
    .horanghae-island-banner {
      display: inline-block;
      background: linear-gradient(135deg, #F7CAC9 0%, #92A8D1 100%);
      color: #2D3142;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: var(--radius-full);
      box-shadow: 0 8px 24px rgba(247, 202, 201, 0.5);
      margin-bottom: 28px;
    }
    .gallery-container {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin: 32px 0;
    }
    .gallery-item {
      background: #FFF;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      max-width: 320px;
      transition: var(--transition);
    }
    [data-theme="dark"] .gallery-item {
      background: #1C1F30;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }
    .gallery-item:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 24px 48px rgba(255, 122, 0, 0.25);
    }
    .gallery-item img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }
    .gallery-item-caption {
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
      padding: 12px 6px 4px;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow ambient-glow-1" style="background: radial-gradient(circle, rgba(255,122,0,0.4) 0%, transparent 70%);"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <span class="brand-diamond">🐯</span>
        <span>虎浪嘿 · HORANGHAE</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">← 返回自我簡介</a></li>
        <li><a href="https://zh.wikipedia.org/zh-tw/SEVENTEEN_(%E7%B5%84%E5%90%88)" target="_blank" class="nav-link">雖本挺維基 🔗</a></li>
      </ul>

      <div class="nav-actions">
        <button id="themeToggleBtn" class="action-btn" title="切換外觀">🌙</button>
        <button id="roarBtn" class="action-btn" title="虎浪嘿叫一聲">🐯</button>
      </div>
    </div>
  </nav>

  <main class="page-container">
    <section class="horanghae-hero">
      <div class="horanghae-badge">
        <span>🐯</span>
        <span>HORANGHAE · 權順榮 HOSHI 的老虎視線</span>
      </div>

      <h1 class="horanghae-title">崔瀚率說窩不執導</h1>
      <h2 class="horanghae-subtitle">安妞！歡迎來到克拉秘密基地 ✨</h2>

      <div>
        <div class="horanghae-island-banner">
          🏝️ 我要衝 2028 克拉島！ 💎
        </div>
      </div>

      <!-- Image Gallery -->
      <div class="gallery-container">
        <!-- 22.jpg -->
        <div class="gallery-item">
          <img src="22.jpg" alt="SEVENTEEN / 22">
          <div class="gallery-item-caption">✨ 22.jpg · 青春記憶</div>
        </div>

        <!-- tamtam.jpg -->
        <div class="gallery-item">
          <img src="images/tamtam.jpg" alt="TamTam 虎浪嘿玩偶" onerror="this.style.display='none'">
          <div class="gallery-item-caption">🐯 TamTam 虎浪嘿吉祥物</div>
        </div>
      </div>

      <!-- Actions -->
      <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 24px;">
        <a href="index.html" class="btn-primary" style="background: var(--gradient-carat);">
          <span>← 回到珮聿的自我簡介</span>
        </a>
        <a href="https://zh.wikipedia.org/zh-tw/SEVENTEEN_(%E7%B5%84%E5%90%88)" target="_blank" rel="noopener noreferrer" class="btn-secondary">
          <span>雖本挺維基 (SEVENTEEN)</span>
          <span>🔗</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 尤珮聿 (Pei-Yu) · 虎浪嘿特輯 · 衝 2028 克拉島！🏝️</p>
  </footer>

  <script>
    // Theme toggle
    const themeBtn = document.getElementById('themeToggleBtn');
    const htmlElem = document.documentElement;
    const savedTheme = localStorage.getItem('site-theme') || 'light';
    htmlElem.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';

    themeBtn.addEventListener('click', () => {
      const current = htmlElem.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      htmlElem.setAttribute('data-theme', next);
      localStorage.setItem('site-theme', next);
      themeBtn.textContent = next === 'light' ? '🌙' : '☀️';
    });

    // Tiger Roar Interactive Effect
    const tigers = ['🐯', '🐅', '🧡', '💎', '✨', '🔥'];
    function spawnTiger(x, y) {
      const el = document.createElement('div');
      el.className = 'click-sparkle';
      el.textContent = tigers[Math.floor(Math.random() * tigers.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
    document.getElementById('roarBtn').addEventListener('click', (e) => {
      const rect = e.target.getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          spawnTiger(rect.left + (Math.random() - 0.5) * 140, rect.top + (Math.random() - 0.5) * 80);
        }, i * 60);
      }
    });
    window.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      spawnTiger(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
